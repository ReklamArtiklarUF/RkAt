# .github/workflows/deploy.yml
# Bygger och deployar på EliteBooken via en self-hosted runner.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}        # "Run workflow"-knapp för manuell omdeploy
  # OBS: aldrig pull_request här – då kan främmande kod köras på din maskin.

concurrency:
  group: deploy-elitebook
  cancel-in-progress: false    # en deploy i taget, köa resten

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, elitebook]
    timeout-minutes: 30
    environment: production    # valfritt: ger deploy-historik i GitHub
    env:
      BASE_DIR: /opt/reklamartiklar
      CI: "1"
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Förkontroller
        run: |
          set -euo pipefail
          node --version && npm --version
          free_mb=$(df -Pm "$BASE_DIR" | awk 'NR==2{print $4}')
          [ "$free_mb" -ge 1024 ] || { echo "::error::Bara ${free_mb} MB ledigt"; exit 1; }

      - name: Skapa release-katalog
        run: |
          set -euo pipefail
          REL="$BASE_DIR/releases/$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "REL=$REL" >> "$GITHUB_ENV"
          mkdir -p "$REL"

      - uses: actions/checkout@v6
        with:
          path: src
          persist-credentials: false

      - name: Kopiera källkod till release
        run: |
          set -euo pipefail
          rsync -a --delete --exclude .git src/ "$REL/"
          echo "$GITHUB_SHA" > "$REL/REVISION"
          # Länka in delade filer om de finns; en saknad (valfri) fil ska inte fälla steget.
          for f in .env; do
            if [ -e "$BASE_DIR/shared/$f" ]; then
              ln -sfn "$BASE_DIR/shared/$f" "$REL/$f"
            fi
          done

      - name: npm ci
        working-directory: ${{ env.REL }}
        run: npm ci --include=dev --no-audit --no-fund

      - name: npm run build
        working-directory: ${{ env.REL }}
        run: |
          npm run build --if-present
          test -n "$(ls -A dist 2>/dev/null)" || { echo "::error::dist saknas/tom"; exit 1; }
          touch .deploy-complete

      - name: Aktivera (byt symlänk, starta om, hälsokontroll, ev. rollback)
        run: /opt/reklamartiklar/activate.sh "$REL" "$GITHUB_SHA"

      - name: Städa misslyckad release
        if: failure()
        run: |
          # Ta bort katalogen bara om den aldrig aktiverats
          [ -n "${REL:-}" ] && [ "$(readlink -f $BASE_DIR/current)" != "$REL" ] && rm -rf -- "$REL" || true

      - name: Telegram-notis
        if: always() && env.TG_TOKEN != ''
        run: |
          case "${{ job.status }}" in success) icon="✅";; *) icon="❌";; esac
          curl -fsS -m 10 -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${icon} Deploy ${GITHUB_SHA::7}: ${{ job.status }} – ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
